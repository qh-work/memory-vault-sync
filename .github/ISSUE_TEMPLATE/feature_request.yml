name: Feature request
description: Propose an improvement to the universal, taskless memory protocol.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain how it preserves taskless ownership, portability, and permission separation.
    validations:
      required: true
  - type: checkboxes
    id: invariants
    attributes:
      label: Architecture confirmation
      options:
        - label: The proposal does not make tasks, projects, chats, devices, or agents own memory.
          required: true
        - label: The proposal does not treat recalled text as instruction or authorization.
          required: true
        - label: The independent protocol/core remains usable without a plugin, Git repository, account, or network service.
          required: true
        - label: The proposal contains no private memory, credentials, paths, or account identifiers.
          required: true
