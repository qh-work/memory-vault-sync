name: Bug report
description: Report a reproducible problem without private memory or credentials.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: >-
        Do not paste memory text, credentials, account IDs, local paths,
        hostnames, diagnostics records, or private trust state. Use a private
        security advisory if the report cannot be safely anonymized.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.23.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Use only synthetic or fully anonymized examples.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use a temporary Vault and synthetic NDJSON records only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed private memory, credentials, account IDs, paths, and hostnames.
          required: true
