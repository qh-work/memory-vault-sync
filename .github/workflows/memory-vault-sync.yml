name: Memory Vault Sync

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin:
    name: Plugin tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "${{ matrix.python-version }}"
      - name: Configure Git fixture identity
        run: |
          git config --global user.name "Memory Vault CI"
          git config --global user.email "memory-vault-ci@localhost"
      - name: Compile runtime
        run: python -m compileall -q plugins/memory-vault-sync/scripts
      - name: Run plugin tests
        run: python -m unittest discover -s plugins/memory-vault-sync/tests -v

  source-contract:
    name: Public source contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Configure Git fixture identity
        run: |
          git config --global user.name "Memory Vault CI"
          git config --global user.email "memory-vault-ci@localhost"
      - name: Compile maintenance tools
        run: python -m compileall -q scripts
      - name: Run source and schema tests
        run: python -m unittest discover -s tests -v

# This public-source workflow intentionally does not validate a live vault
# layout. Exported source contains no tasks, sources, bindings, memory, device
# instances, handoffs, or migration state. A private deployment should add its
# own complete-layout job against its separately governed data repository.
